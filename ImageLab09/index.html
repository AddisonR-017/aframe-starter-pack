<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"> </script>
     <script src="https://unpkg.com/aframe-environment-component/dist/aframe-environment-component.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-box position="-0.75 1.5 -4" width="1" height="0.15" depth="0.15" rotation="0 0 40" color="#90523D"></a-box>
      <a-box position="0.75 1.5 -4" width="1" height="0.15" depth="0.15" rotation="0 0 -40" color="#90523D"></a-box>
      <a-sphere position="0 0.55 -4" radius="0.75" color="#FFFFFF"></a-sphere>
      <a-sphere position="0 1.5 -4" radius="0.6" color="#FFFFFF"></a-sphere>
      <a-sphere position="0 2.25 -4" radius="0.45" color="#FFFFFF"></a-sphere>
      <a-sphere position="-0.2 2.3 -3.58" radius="0.05" color="#000000"></a-sphere>
      <a-sphere position="0.2 2.3 -3.58" radius="0.05" color="#000000"></a-sphere>
      <a-sphere position="0 1.7 -3.45" radius="0.06" color="#000000"></a-sphere>
      <a-sphere position="0 1.4 -3.42" radius="0.06" color="#000000"></a-sphere>
      <a-cone position="0 2.25 -3.35" radius-bottom="0.1" radius-top="0" height="0.5" rotation="90 0 0" color="#EE6A07"></a-cone>
      
      <!-- the enviroment entity includes a sky. Choose from the presets"none, default, contact, egypt, checkerboard, forest, goaland, yavapai, goldmine, threetowers, poison, arches, tron, japan, dream, volcano, starry, osiris, moon" -->
      <a-entity environment="preset: japan; dressingAmount: 1"></a-entity>
    </a-scene>
  </body>
</html>
